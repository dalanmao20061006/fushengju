name: build-webrtc-aec3-android

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "Android NDK 版本"
        required: true
        default: "r27c"

jobs:
  aec3:
    name: AEC3 arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config

      - name: 安装 NDK
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk_version }}-linux.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "NDK=$RUNNER_TEMP/android-ndk-${{ inputs.ndk_version }}" >> "$GITHUB_ENV"

      - name: 拉取 webrtc-audio-processing
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitlab.freedesktop.org/pulseaudio/webrtc-audio-processing.git src
          cd src
          ls

      - name: 写交叉编译文件
        run: |
          set -euo pipefail
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > "$GITHUB_WORKSPACE/android-cross.ini" <<EOF
          [binaries]
          c = '$TC/aarch64-linux-android28-clang'
          cpp = '$TC/aarch64-linux-android28-clang++'
          ar = '$TC/llvm-ar'
          strip = '$TC/llvm-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF
          cat "$GITHUB_WORKSPACE/android-cross.ini"

      - name: Configure
        run: |
          set -euo pipefail
          meson setup build src --cross-file "$GITHUB_WORKSPACE/android-cross.ini" \
            --default-library=shared --buildtype=release \
            -Dprefix="$GITHUB_WORKSPACE/out" 2>&1 | tee configure.log

      - name: 编译安装
        run: |
          set -euo pipefail
          ninja -C build -j"$(nproc)" 2>&1 | tee build.log
          ninja -C build install

      - name: 打包
        run: |
          set -euo pipefail
          mkdir -p dist
          find out -name "*.so*" -exec cp -v {} dist/ \; || true
          ls -lh dist/
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for f in dist/*; do echo "--- $f"; "$READELF" -d "$f" | grep NEEDED || true; done

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-aec3-arm64
          path: dist/
          if-no-files-found: error

      - name: 失败传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aec3-logs
          path: |
            configure.log
            build.log
