name: build-aec-jni-v3

on:
  workflow_dispatch:

jobs:
  build:
    name: build libfsjaec.so
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config

      - name: 安装 NDK
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/ndk.zip" "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "NDK=$RUNNER_TEMP/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: 拉 webrtc 源码
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitlab.freedesktop.org/pulseaudio/webrtc-audio-processing.git src

      - name: 交叉编译配置
        run: |
          set -euo pipefail
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          printf '%s\n' "[binaries]" "c = '$TC/aarch64-linux-android28-clang'" "cpp = '$TC/aarch64-linux-android28-clang++'" "ar = '$TC/llvm-ar'" "strip = '$TC/llvm-strip'" "" "[host_machine]" "system = 'android'" "cpu_family = 'aarch64'" "cpu = 'aarch64'" "endian = 'little'" > android-cross.ini
          cat android-cross.ini

      - name: 编译并安装 webrtc
        run: |
          set -euo pipefail
          meson setup build src --cross-file android-cross.ini --default-library=shared --buildtype=release -Dprefix="$GITHUB_WORKSPACE/out"
          ninja -C build -j"$(nproc)"
          ninja -C build install
          echo "=== out 目录 ==="
          find out -maxdepth 2 -type d
          ls -l out/lib || true

      - name: 写入 JNI 源码
        run: |
          set -euo pipefail
          mkdir -p jni
          printf '%s' '' | base64 -d > jni/aec_jni.cpp
          echo "源码大小：$(wc -c < jni/aec_jni.cpp) 字节"
          head -3 jni/aec_jni.cpp
          test "$(wc -c < jni/aec_jni.cpp)" -gt 1000

      - name: 编译 libfsjaec.so
        run: |
          set -euo pipefail
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p dist
          set +e
          "$TC/aarch64-linux-android28-clang++" -std=c++17 -fPIC -shared -O2             -I out/include/webrtc-audio-processing-2 \
            -I out/include             jni/aec_jni.cpp             -L out/lib -lwebrtc-audio-processing-2             -llog -landroid -o dist/libfsjaec.so > jni-build.log 2>&1
          RC=$?
          set -e
          echo "编译退出码：$RC"
          if [ $RC -ne 0 ]; then
            echo "===== 错误摘要 ====="
            grep -n "error:" jni-build.log | head -20 || true
            echo "===== 日志尾部 ====="
            tail -30 jni-build.log || true
            exit 1
          fi
          ls -lh dist/

      - name: 上传
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fsjaec-arm64
          path: dist/
          if-no-files-found: error

      - name: 失败也传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jni-build-log
          path: jni-build.log
