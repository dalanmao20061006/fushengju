name: build-aec-jni

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "Android NDK 版本"
        required: true
        default: "r27c"

jobs:
  build:
    name: build libfsjaec.so
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson pkg-config

      - name: 安装 NDK
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk_version }}-linux.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "NDK=$RUNNER_TEMP/android-ndk-${{ inputs.ndk_version }}" >> "$GITHUB_ENV"

      - name: 拉 webrtc 源码
        run: |
          git clone --depth 1 https://gitlab.freedesktop.org/pulseaudio/webrtc-audio-processing.git src

      - name: 交叉编译配置
        run: |
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > "$GITHUB_WORKSPACE/android-cross.ini" <<EOF
          [binaries]
          c = '$TC/aarch64-linux-android28-clang'
          cpp = '$TC/aarch64-linux-android28-clang++'
          ar = '$TC/llvm-ar'
          strip = '$TC/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      - name: 编译并安装 webrtc
        run: |
          meson setup build src --cross-file "$GITHUB_WORKSPACE/android-cross.ini" \
            --default-library=shared --buildtype=release -Dprefix="$GITHUB_WORKSPACE/out"
          ninja -C build -j"$(nproc)"
          ninja -C build install

      - name: 写入 JNI 源码
        run: |
          mkdir -p jni
          cat > jni/aec_jni.cpp <<'CPP'
// 浮生居 · WebRTC AEC3 的 JNI 包装
// Java 只看到四个方法：create / setReference / process / release
#include <jni.h>
#include <cstring>
#include <cstdint>
#include <vector>

#include "webrtc/api/audio/audio_processing.h"
#include "webrtc/api/scoped_refptr.h"

static rtc::scoped_refptr<webrtc::AudioProcessing> g_apm;
static int g_rate = 16000;
static std::vector<int16_t> g_out;

static bool ensure(int rate) {
    if (g_apm && g_rate == rate) return true;
    webrtc::AudioProcessing::Config cfg;
    cfg.echo_canceller.enabled = true;
    cfg.echo_canceller.mobile_mode = false;
    cfg.noise_suppression.enabled = true;
    cfg.high_pass_filter.enabled = true;
    cfg.gain_controller1.enabled = false;
    cfg.gain_controller2.enabled = false;
    cfg.transient_suppression.enabled = false;

    g_apm = webrtc::AudioProcessingBuilder().SetConfig(cfg).Create();
    if (!g_apm) return false;

    webrtc::AudioProcessing::ProcessingConfig pc;
    pc.input_stream = webrtc::StreamConfig(rate, 1);
    pc.output_stream = webrtc::StreamConfig(rate, 1);
    pc.reverse_input_stream = webrtc::StreamConfig(rate, 1);
    pc.reverse_output_stream = webrtc::StreamConfig(rate, 1);
    if (g_apm->Initialize(pc) != 0) { g_apm = nullptr; return false; }
    g_apm->ApplyConfig(cfg);
    g_rate = rate;
    return true;
}

extern "C" JNIEXPORT jboolean JNICALL
Java_com_fushengju_app_AecBridge_create(JNIEnv*, jclass, jint rate) {
    g_apm = nullptr;
    g_rate = 0;
    return ensure(rate) ? JNI_TRUE : JNI_FALSE;
}

// 参考信号：她正在播的声音（同一个 10ms 帧）
extern "C" JNIEXPORT void JNICALL
Java_com_fushengju_app_AecBridge_setReference(JNIEnv* env, jclass, jshortArray pcm, jint frames) {
    if (!g_apm) return;
    jshort* p = env->GetShortArrayElements(pcm, nullptr);
    if (!p) return;
    std::vector<int16_t> dst((size_t) frames);
    webrtc::StreamConfig cfg(g_rate, 1);
    g_apm->ProcessReverseStream(p, cfg, cfg, dst.data());
    env->ReleaseShortArrayElements(pcm, p, JNI_ABORT);
}

// 近端：麦克风输入 → 消掉她的声音 → 返回干净音频
extern "C" JNIEXPORT jshortArray JNICALL
Java_com_fushengju_app_AecBridge_process(JNIEnv* env, jclass, jshortArray pcm, jint frames) {
    if (!g_apm) return pcm;
    jshort* p = env->GetShortArrayElements(pcm, nullptr);
    if (!p) return pcm;
    g_out.assign((size_t) frames, 0);
    webrtc::StreamConfig cfg(g_rate, 1);
    g_apm->ProcessStream(p, cfg, cfg, g_out.data());
    env->ReleaseShortArrayElements(pcm, p, JNI_ABORT);

    jshortArray res = env->NewShortArray(frames);
    env->SetShortArrayRegion(res, 0, frames, g_out.data());
    return res;
}

extern "C" JNIEXPORT void JNICALL
Java_com_fushengju_app_AecBridge_release(JNIEnv*, jclass) {
    g_apm = nullptr;
    g_rate = 0;
    g_out.clear();
}

CPP

      - name: 编译 libfsjaec.so
        run: |
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p dist
          "$TC/aarch64-linux-android28-clang++" -std=c++17 -fPIC -shared -O2 \
            -I "$GITHUB_WORKSPACE/out/include" \
            -I "$GITHUB_WORKSPACE/out/include/webrtc" \
            jni/aec_jni.cpp \
            -L "$GITHUB_WORKSPACE/out/lib" -lwebrtc-audio-processing-2 \
            -llog -landroid -o dist/libfsjaec.so 2>&1 | tee jni-build.log
          ls -lh dist/

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: fsjaec-arm64
          path: dist/
          if-no-files-found: error

      - name: 失败也传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jni-build-log
          path: jni-build.log
